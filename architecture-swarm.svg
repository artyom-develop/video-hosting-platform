<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- User -->
  <rect x="250" y="10" width="100" height="40" fill="lightblue" stroke="black"/>
  <text x="300" y="35" text-anchor="middle" font-family="Arial" font-size="14">User</text>

  <!-- Arrow User to NGINX -->
  <line x1="300" y1="50" x2="300" y2="70" stroke="black" marker-end="url(#arrowhead)"/>

  <!-- NGINX -->
  <rect x="200" y="80" width="200" height="40" fill="lightgreen" stroke="black"/>
  <text x="300" y="95" text-anchor="middle" font-family="Arial" font-size="14">NGINX (Load Balancer)</text>
  <text x="300" y="110" text-anchor="middle" font-family="Arial" font-size="12">1 replica</text>

  <!-- Arrow NGINX to Frontend -->
  <line x1="200" y1="100" x2="150" y2="100" stroke="black" marker-end="url(#arrowhead)"/>
  <rect x="50" y="80" width="100" height="40" fill="lightyellow" stroke="black"/>
  <text x="100" y="95" text-anchor="middle" font-family="Arial" font-size="12">Frontend (React)</text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>

  <!-- Arrow NGINX to Backend -->
  <line x1="400" y1="100" x2="450" y2="100" stroke="black" marker-end="url(#arrowhead)"/>
  <rect x="450" y="80" width="100" height="40" fill="lightcoral" stroke="black"/>
  <text x="500" y="95" text-anchor="middle" font-family="Arial" font-size="12">Backend (FastAPI)</text>
  <text x="500" y="110" text-anchor="middle" font-family="Arial" font-size="10">3 replicas</text>

  <!-- Arrow Backend to Redis -->
  <line x1="500" y1="120" x2="500" y2="140" stroke="black" marker-end="url(#arrowhead)"/>
  <rect x="450" y="150" width="100" height="40" fill="lightpink" stroke="black"/>
  <text x="500" y="165" text-anchor="middle" font-family="Arial" font-size="12">Redis (Cache)</text>
  <text x="500" y="180" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>

  <!-- Arrow Backend to PostgreSQL -->
  <line x1="500" y1="190" x2="500" y2="210" stroke="black" marker-end="url(#arrowhead)"/>
  <rect x="450" y="220" width="100" height="40" fill="lightcyan" stroke="black"/>
  <text x="500" y="235" text-anchor="middle" font-family="Arial" font-size="12">PostgreSQL (DB)</text>
  <text x="500" y="250" text-anchor="middle" font-family="Arial" font-size="10">Primary + Replica</text>

  <!-- RTMP -->
  <rect x="50" y="220" width="100" height="40" fill="lightsalmon" stroke="black"/>
  <text x="100" y="235" text-anchor="middle" font-family="Arial" font-size="12">RTMP Server</text>
  <text x="100" y="250" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>
  <line x1="150" y1="240" x2="450" y2="240" stroke="black" marker-end="url(#arrowhead)"/>

  <!-- Prometheus -->
  <rect x="50" y="300" width="100" height="40" fill="lightgray" stroke="black"/>
  <text x="100" y="315" text-anchor="middle" font-family="Arial" font-size="12">Prometheus</text>
  <text x="100" y="330" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>

  <!-- Grafana -->
  <rect x="200" y="300" width="100" height="40" fill="lightsteelblue" stroke="black"/>
  <text x="250" y="315" text-anchor="middle" font-family="Arial" font-size="12">Grafana</text>
  <text x="250" y="330" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>
  <line x1="150" y1="320" x2="200" y2="320" stroke="black" marker-end="url(#arrowhead)"/>

  <!-- Node Exporter -->
  <rect x="350" y="300" width="100" height="40" fill="lightgoldenrodyellow" stroke="black"/>
  <text x="400" y="315" text-anchor="middle" font-family="Arial" font-size="12">Node Exporter</text>
  <text x="400" y="330" text-anchor="middle" font-family="Arial" font-size="10">1 replica</text>
  <line x1="350" y1="320" x2="300" y2="320" stroke="black" marker-end="url(#arrowhead)"/>

  <!-- Swarm note -->
  <text x="300" y="370" text-anchor="middle" font-family="Arial" font-size="12" fill="red">Overlay Network, HA, Auto-scaling</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="black"/>
    </marker>
  </defs>
</svg>