user www-data;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log debug;

# Переменные окружения для хуков (можно переопределить при запуске)
env BACKEND_HOST;
env BACKEND_PORT;

events {
    worker_connections 1024;
}

# HTTP блок для сервирования HLS файлов
http {
    # Динамическое разрешение имён хостов
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    
    # Минимальная HTTP конфигурация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Типы MIME для HLS
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        text/plain txt;
    }
    
    # HTTP сервер для HLS и DASH файлов
    server {
        listen 80;
        server_name _;
        
        # Сервирование HLS файлов
        location /live/ {
            alias /tmp/hls/;
            
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
        
        # Сервирование DASH файлов
        location /dash/ {
            alias /tmp/dash/;
            
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            
            types {
                application/dash+xml mpd;
                video/mp4 mp4 m4s m4v;
            }
        }
    }
}

# RTMP конфигурация
rtmp_auto_push on;
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        timeout 60s;
        listen [::]:1935 ipv6only=on;
        # Main application
        application live {
            live on;
            record off;
            record_path /recordings;
            record_append on;

            # HLS output (optimized for low latency)
            hls on;
            hls_path /tmp/hls;
            hls_fragment 1;              # 1 second segments for faster updates
            hls_playlist_length 10;      # 10 segments = 10 seconds playlist

            # DASH output
            dash on;
            dash_path /tmp/dash;
            dash_fragment 1;             # 1 second segments for DASH too
            dash_playlist_length 10;

            # On publish hooks for stream management
            # Блокирующие хуки - соединение будет разорвано если хук вернёт ошибку
            on_publish http://$BACKEND_HOST:$BACKEND_PORT/api/rtmp/publish;
            on_publish_done http://$BACKEND_HOST:$BACKEND_PORT/api/rtmp/unpublish;

            # Deny all publish by default, allow only after successful validation
            allow publish all;
            allow play all;
        }

        # Statistics page
        application stat {
            live on;
        }
    }
}